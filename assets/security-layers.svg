<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1076" width="1240" height="1076" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Defense in depth: nine security layers</title>
  <desc id="d">Nine stacked security layers from the OCI Security List at the cloud edge down to secrets handling at the core. An animated legitimate HTTPS request passes through every layer while a probe on a closed port is dropped at layer 1.</desc>
  <style>
    @keyframes pulse {
      0%   { opacity: 0; }
      2%   { opacity: 0.95; }
      9%   { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes railflow { to { stroke-dashoffset: -24; } }
    .glow { opacity: 0; }
    .p0 { animation: pulse 10.0s linear 0.80s infinite; }
    .p1 { animation: pulse 10.0s linear 1.62s infinite; }
    .p2 { animation: pulse 10.0s linear 2.44s infinite; }
    .p3 { animation: pulse 10.0s linear 3.27s infinite; }
    .p4 { animation: pulse 10.0s linear 4.09s infinite; }
    .p5 { animation: pulse 10.0s linear 4.92s infinite; }
    .p6 { animation: pulse 10.0s linear 5.74s infinite; }
    .p7 { animation: pulse 10.0s linear 6.57s infinite; }
    .p8 { animation: pulse 10.0s linear 7.39s infinite; }
    .rail { stroke-dasharray: 2 10; animation: railflow 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="pk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#0d9488"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#e11d48"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C74634"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="1238.5" height="1074.5" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Defense in depth</text>
  <text x="40" y="74" font-size="14" fill="#475569">An attacker has to defeat every layer in turn. Outermost (cloud edge) at the top, secrets at the core.</text>

  <!-- legend -->
  <g font-size="12.5" fill="#475569">
    <rect x="760" y="96" width="440" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/>
    <circle cx="782" cy="114" r="6" fill="#0d9488"/>
    <text x="796" y="118.5">legitimate HTTPS request: passes every layer</text>
    <circle cx="782" cy="136" r="6" fill="#e11d48"/>
    <text x="796" y="140.5">probe on a closed port: dropped at layer 1</text>
  </g>

  <!-- attacker / internet node -->
  <circle cx="62" cy="118" r="17" fill="#fff1f2" stroke="#C74634" stroke-width="2"/>
  <path d="M54,124 L54,115 L62,109 L70,115 L70,124 z" fill="#C74634"/>
  <text x="90" y="123" font-size="14" font-weight="600" fill="#0f172a">Internet traffic</text>

  <!-- column headers -->
  <g font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
    <text x="130" y="182">LAYER</text>
    <text x="490" y="182">CONTROLS</text>
    <text x="930" y="182">STOPS</text>
  </g>

  <!-- rail -->
  <line x1="62" y1="150" x2="62" y2="990" stroke="#C74634" stroke-width="2.5" class="rail" stroke-linecap="round"/>
  <path d="M53,990 L71,990 L62,1006 z" fill="#C74634"/>

  <!-- layer 1 -->
  <g>
    <line x1="62" y1="235.0" x2="110" y2="235.0" stroke="#C74634" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="196" width="1090" height="78" rx="12" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p0" x="107" y="193" width="1096" height="84" rx="14" fill="none" stroke="#b4372a" stroke-width="3"/>
    <circle cx="148" cy="235.0" r="19" fill="#C74634"/>
    <text x="148" y="240.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="182" y="230.0" font-size="16" font-weight="700" fill="#b4372a">OCI Security List</text>
    <text x="182" y="251.0" font-size="12.5" fill="#64748b">cloud edge, before the VM</text>
    <text x="490" y="230.0" font-size="13" fill="#0f172a">Ingress only 22022 · 80 · 443 (+ICMP 3/4, VCN-internal)</text>
    <text x="490" y="251.0" font-size="12.5" fill="#475569">port 22, 8000, 8080, 6001/6002, DB ports never reachable</text>
    <text x="930" y="240.0" font-size="13" fill="#b4372a">port scans, exposed admin/DB ports</text>
  </g>
  <!-- layer 2 -->
  <g>
    <line x1="62" y1="323.0" x2="110" y2="323.0" stroke="#e11d48" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="284" width="1090" height="78" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p1" x="107" y="281" width="1096" height="84" rx="14" fill="none" stroke="#be123c" stroke-width="3"/>
    <circle cx="148" cy="323.0" r="19" fill="#e11d48"/>
    <text x="148" y="328.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="182" y="318.0" font-size="16" font-weight="700" fill="#be123c">Host firewall (iptables)</text>
    <text x="182" y="339.0" font-size="12.5" fill="#64748b">INPUT chain on the VM</text>
    <text x="490" y="318.0" font-size="13" fill="#0f172a">Oracle image default REJECT kept; open-ports inserts</text>
    <text x="490" y="339.0" font-size="12.5" fill="#475569">ACCEPT 80/443/22022 above it · persisted with netfilter</text>
    <text x="930" y="328.0" font-size="13" fill="#be123c">anything that slips past layer 1</text>
  </g>
  <!-- layer 3 -->
  <g>
    <line x1="62" y1="411.0" x2="110" y2="411.0" stroke="#d97706" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="372" width="1090" height="78" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p2" x="107" y="369" width="1096" height="84" rx="14" fill="none" stroke="#b45309" stroke-width="3"/>
    <circle cx="148" cy="411.0" r="19" fill="#d97706"/>
    <text x="148" y="416.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="182" y="406.0" font-size="16" font-weight="700" fill="#b45309">DOCKER-USER guard</text>
    <text x="182" y="427.0" font-size="12.5" fill="#64748b">Docker bypasses INPUT</text>
    <text x="490" y="406.0" font-size="13" fill="#0f172a">DROP public 8000 / 6001 / 6002 / 8080 (conntrack orig port)</text>
    <text x="490" y="427.0" font-size="12.5" fill="#475569">REJECT egress to crypto-mining pool ports (host + containers)</text>
    <text x="930" y="416.0" font-size="13" fill="#b45309">published-port leaks, miner callbacks</text>
  </g>
  <!-- layer 4 -->
  <g>
    <line x1="62" y1="499.0" x2="110" y2="499.0" stroke="#0284c7" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="460" width="1090" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p3" x="107" y="457" width="1096" height="84" rx="14" fill="none" stroke="#0369a1" stroke-width="3"/>
    <circle cx="148" cy="499.0" r="19" fill="#0284c7"/>
    <text x="148" y="504.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="182" y="494.0" font-size="16" font-weight="700" fill="#0369a1">SSH hardening</text>
    <text x="182" y="515.0" font-size="12.5" fill="#64748b">sshd + fail2ban</text>
    <text x="490" y="494.0" font-size="13" fill="#0f172a">Port 22022 · keys only · no passwords · no root from outside</text>
    <text x="490" y="515.0" font-size="12.5" fill="#475569">MaxAuthTries 3 · fail2ban 3 fails → 24 h ban, escalating</text>
    <text x="930" y="504.0" font-size="13" fill="#0369a1">brute force, credential stuffing</text>
  </g>
  <!-- layer 5 -->
  <g>
    <line x1="62" y1="587.0" x2="110" y2="587.0" stroke="#16a34a" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="548" width="1090" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p4" x="107" y="545" width="1096" height="84" rx="14" fill="none" stroke="#15803d" stroke-width="3"/>
    <circle cx="148" cy="587.0" r="19" fill="#16a34a"/>
    <text x="148" y="592.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="182" y="582.0" font-size="16" font-weight="700" fill="#15803d">TLS everywhere</text>
    <text x="182" y="603.0" font-size="12.5" fill="#64748b">Traefik + Let's Encrypt</text>
    <text x="490" y="582.0" font-size="13" fill="#0f172a">HTTP → HTTPS redirect · per-host certs via ACME HTTP-01</text>
    <text x="490" y="603.0" font-size="12.5" fill="#475569">auto-renewal · health-check alerts if a cert has &lt; 14 days</text>
    <text x="930" y="592.0" font-size="13" fill="#15803d">sniffing, session hijack, MITM</text>
  </g>
  <!-- layer 6 -->
  <g>
    <line x1="62" y1="675.0" x2="110" y2="675.0" stroke="#4f46e5" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="636" width="1090" height="78" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p5" x="107" y="633" width="1096" height="84" rx="14" fill="none" stroke="#4338ca" stroke-width="3"/>
    <circle cx="148" cy="675.0" r="19" fill="#4f46e5"/>
    <text x="148" y="680.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">6</text>
    <text x="182" y="670.0" font-size="16" font-weight="700" fill="#4338ca">Coolify account security</text>
    <text x="182" y="691.0" font-size="12.5" fill="#64748b">the PaaS control plane</text>
    <text x="490" y="670.0" font-size="13" fill="#0f172a">TOTP 2FA required · public signup off · API off by default</text>
    <text x="490" y="691.0" font-size="12.5" fill="#475569">login fail2ban: 5 fails / 10 min → 24 h ban (DOCKER-USER)</text>
    <text x="930" y="680.0" font-size="13" fill="#4338ca">dashboard takeover, rogue accounts</text>
  </g>
  <!-- layer 7 -->
  <g>
    <line x1="62" y1="763.0" x2="110" y2="763.0" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="724" width="1090" height="78" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p6" x="107" y="721" width="1096" height="84" rx="14" fill="none" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="148" cy="763.0" r="19" fill="#7c3aed"/>
    <text x="148" y="768.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">7</text>
    <text x="182" y="758.0" font-size="16" font-weight="700" fill="#6d28d9">Kernel and network hardening</text>
    <text x="182" y="779.0" font-size="12.5" fill="#64748b">sysctl profile</text>
    <text x="490" y="758.0" font-size="13" fill="#0f172a">syncookies · rp_filter · no redirects / source routing</text>
    <text x="490" y="779.0" font-size="12.5" fill="#475569">kptr_restrict 2 · dmesg_restrict · protected links</text>
    <text x="930" y="768.0" font-size="13" fill="#6d28d9">spoofing, SYN floods, info leaks</text>
  </g>
  <!-- layer 8 -->
  <g>
    <line x1="62" y1="851.0" x2="110" y2="851.0" stroke="#0d9488" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="812" width="1090" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p7" x="107" y="809" width="1096" height="84" rx="14" fill="none" stroke="#0f766e" stroke-width="3"/>
    <circle cx="148" cy="851.0" r="19" fill="#0d9488"/>
    <text x="148" y="856.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">8</text>
    <text x="182" y="846.0" font-size="16" font-weight="700" fill="#0f766e">Patching and guardrails</text>
    <text x="182" y="867.0" font-size="12.5" fill="#64748b">security-watch + unattended-upgrades</text>
    <text x="490" y="846.0" font-size="13" fill="#0f172a">feeds → auto-upgrade Coolify · OS/Docker patches daily</text>
    <text x="490" y="867.0" font-size="12.5" fill="#475569">kill miners · lock rogue users · revert SSH keys · lockdown</text>
    <text x="930" y="856.0" font-size="13" fill="#0f766e">known CVEs, RCE follow-through</text>
  </g>
  <!-- layer 9 -->
  <g>
    <line x1="62" y1="939.0" x2="110" y2="939.0" stroke="#475569" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="110" y="900" width="1090" height="78" rx="12" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#sh)"/>
    <rect class="glow p8" x="107" y="897" width="1096" height="84" rx="14" fill="none" stroke="#0f172a" stroke-width="3"/>
    <circle cx="148" cy="939.0" r="19" fill="#475569"/>
    <text x="148" y="944.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">9</text>
    <text x="182" y="934.0" font-size="16" font-weight="700" fill="#0f172a">Secrets handling</text>
    <text x="182" y="955.0" font-size="12.5" fill="#64748b">the core</text>
    <text x="490" y="934.0" font-size="13" fill="#0f172a">keys/ git-ignored · VM secrets root-only 600 · least-privilege</text>
    <text x="490" y="955.0" font-size="12.5" fill="#475569">automation identity · temp tokens revoked · secret-scan CI</text>
    <text x="930" y="944.0" font-size="13" fill="#0f172a">credential leaks, blast radius</text>
  </g>

  <!-- animated legitimate request: travels the rail through all layers -->
  <circle r="11" fill="url(#pk)" cx="62" cy="150">
    <animate attributeName="cy" values="150;988;988;150" keyTimes="0;0.8;0.999;1" dur="10.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.86;1" dur="10.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#ffffff" cx="62" cy="150">
    <animate attributeName="cy" values="150;988;988;150" keyTimes="0;0.8;0.999;1" dur="10.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.86;1" dur="10.0s" repeatCount="indefinite"/>
  </circle>

  <!-- animated probe: comes in later, hits layer 1, bounces back -->
  <circle r="10" fill="url(#pr)" cx="62" cy="150" opacity="0">
    <animate attributeName="cy" values="150;150;235.0;146;150" keyTimes="0;0.45;0.55;0.65;1" dur="10.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.6;0.66;1" dur="10.0s" repeatCount="indefinite"/>
  </circle>
  <!-- impact mark on layer 1 -->
  <g opacity="0" transform="translate(62 235.0)">
    <circle r="15" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.54;0.56;0.64;1" dur="10.0s" repeatCount="indefinite"/>
  </g>

  <!-- footnote -->
  <rect x="110" y="1016" width="1090" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="128" y="1038" font-size="12.5" fill="#475569">Lockdown stops the Coolify control plane only: apps, Traefik/HTTPS and owner SSH keep running. Undo with: security-watch.py unlock</text>
</svg>

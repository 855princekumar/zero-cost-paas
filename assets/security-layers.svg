<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="t d">
  <title id="t">Defense in depth — nine security layers</title>
  <desc id="d">Nine stacked security layers from the cloud edge inward: OCI Security List, host iptables, DOCKER-USER guard, SSH hardening with fail2ban, TLS everywhere, Coolify account security, kernel hardening, automated patching and security-watch guardrails, and secrets handling. Each layer lists its controls and the threat it stops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="1200" height="980" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="46" font-size="26" font-weight="700" fill="#f8fafc">Defense in depth</text>
    <text x="40" y="70" font-size="14" fill="#94a3b8">An attacker has to defeat every layer in turn. Outermost (cloud edge) at the top, secrets at the core.</text>

    <!-- attacker arrow -->
    <g transform="translate(40,96)">
      <circle cx="18" cy="18" r="16" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
      <path d="M10 14 l8 -6 l8 6 v8 h-16 z" fill="#f87171"/>
      <text x="44" y="23" font-size="14" font-weight="700" fill="#fecaca">Internet traffic / attacker</text>
    </g>
    <path d="M58 132 V930" stroke="#f87171" stroke-width="3" stroke-dasharray="2 6" marker-end="url(#a)"/>

    <!-- column headers -->
    <g font-size="12" fill="#64748b" font-weight="700">
      <text x="110" y="148">LAYER</text>
      <text x="470" y="148">CONTROLS</text>
      <text x="900" y="148">STOPS</text>
    </g>

    <!-- layer template: x offset grows inward -->
    <g font-size="13">
      <!-- 1 -->
      <g transform="translate(90,158)">
        <rect width="1070" height="78" rx="12" fill="#1f1311" stroke="#C74634" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#C74634"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#fecaca">OCI Security List</text>
        <text x="66" y="54" fill="#94a3b8">cloud edge, before the VM</text>
        <text x="380" y="34" fill="#e2e8f0">Ingress only 22022 · 80 · 443 (+ICMP 3/4, VCN-internal)</text>
        <text x="380" y="54" fill="#94a3b8">port 22, 8000, 8080, 6001/6002, DB ports never reachable</text>
        <text x="810" y="44" fill="#fca5a5">port scans, exposed admin/DB ports</text>
      </g>
      <!-- 2 -->
      <g transform="translate(90,244)">
        <rect width="1070" height="78" rx="12" fill="#1f1414" stroke="#ef4444" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#ef4444"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#fecaca">Host firewall (iptables)</text>
        <text x="66" y="54" fill="#94a3b8">INPUT chain on the VM</text>
        <text x="380" y="34" fill="#e2e8f0">Oracle image default REJECT kept; open-ports inserts</text>
        <text x="380" y="54" fill="#94a3b8">ACCEPT 80/443/22022 above it · persisted with netfilter</text>
        <text x="810" y="44" fill="#fca5a5">anything that slips past layer 1</text>
      </g>
      <!-- 3 -->
      <g transform="translate(90,330)">
        <rect width="1070" height="78" rx="12" fill="#1c1a12" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#f59e0b"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#1c1917">3</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#fde68a">DOCKER-USER guard</text>
        <text x="66" y="54" fill="#94a3b8">Docker bypasses INPUT</text>
        <text x="380" y="34" fill="#e2e8f0">DROP public 8000 / 6001 / 6002 / 8080 (conntrack orig port)</text>
        <text x="380" y="54" fill="#94a3b8">REJECT egress to crypto-mining pool ports (host + containers)</text>
        <text x="810" y="44" fill="#fde68a">published-port leaks, miner callbacks</text>
      </g>
      <!-- 4 -->
      <g transform="translate(90,416)">
        <rect width="1070" height="78" rx="12" fill="#121a2a" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#38bdf8"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#0b1220">4</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#bae6fd">SSH hardening</text>
        <text x="66" y="54" fill="#94a3b8">sshd + fail2ban</text>
        <text x="380" y="34" fill="#e2e8f0">Port 22022 · keys only · no passwords · no root from outside</text>
        <text x="380" y="54" fill="#94a3b8">MaxAuthTries 3 · fail2ban 3 fails → 24 h ban, escalating</text>
        <text x="810" y="44" fill="#7dd3fc">brute force, credential stuffing</text>
      </g>
      <!-- 5 -->
      <g transform="translate(90,502)">
        <rect width="1070" height="78" rx="12" fill="#0f2320" stroke="#22c55e" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#22c55e"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#052e16">5</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#bbf7d0">TLS everywhere</text>
        <text x="66" y="54" fill="#94a3b8">Traefik + Let's Encrypt</text>
        <text x="380" y="34" fill="#e2e8f0">HTTP → HTTPS redirect · per-host certs via ACME HTTP-01</text>
        <text x="380" y="54" fill="#94a3b8">auto-renewal · health-check alerts if a cert has &lt; 14 days</text>
        <text x="810" y="44" fill="#86efac">sniffing, session hijack, MITM</text>
      </g>
      <!-- 6 -->
      <g transform="translate(90,588)">
        <rect width="1070" height="78" rx="12" fill="#15152b" stroke="#6366f1" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#6366f1"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">6</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#c7d2fe">Coolify account security</text>
        <text x="66" y="54" fill="#94a3b8">the PaaS control plane</text>
        <text x="380" y="34" fill="#e2e8f0">TOTP 2FA required · public signup off · API off by default</text>
        <text x="380" y="54" fill="#94a3b8">login fail2ban: 5 fails / 10 min → 24 h ban (DOCKER-USER)</text>
        <text x="810" y="44" fill="#a5b4fc">dashboard takeover, rogue accounts</text>
      </g>
      <!-- 7 -->
      <g transform="translate(90,674)">
        <rect width="1070" height="78" rx="12" fill="#1a1625" stroke="#a78bfa" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#a78bfa"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#1e1b4b">7</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#ddd6fe">Kernel &amp; network hardening</text>
        <text x="66" y="54" fill="#94a3b8">sysctl profile</text>
        <text x="380" y="34" fill="#e2e8f0">syncookies · rp_filter · no redirects / source routing</text>
        <text x="380" y="54" fill="#94a3b8">kptr_restrict 2 · dmesg_restrict · protected links</text>
        <text x="810" y="44" fill="#c4b5fd">spoofing, SYN floods, info leaks</text>
      </g>
      <!-- 8 -->
      <g transform="translate(90,760)">
        <rect width="1070" height="78" rx="12" fill="#0f2229" stroke="#14b8a6" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#14b8a6"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#042f2e">8</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#99f6e4">Patching &amp; guardrails</text>
        <text x="66" y="54" fill="#94a3b8">security-watch + unattended-upgrades</text>
        <text x="380" y="34" fill="#e2e8f0">feeds → auto-upgrade Coolify · OS/Docker patches daily</text>
        <text x="380" y="54" fill="#94a3b8">kill miners · lock rogue users · revert SSH keys · lockdown</text>
        <text x="810" y="44" fill="#5eead4">known CVEs, RCE follow-through</text>
      </g>
      <!-- 9 -->
      <g transform="translate(90,846)">
        <rect width="1070" height="78" rx="12" fill="#1f1d1a" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="34" cy="39" r="20" fill="#e2e8f0"/><text x="34" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#0b1220">9</text>
        <text x="66" y="34" font-size="15" font-weight="700" fill="#f8fafc">Secrets handling</text>
        <text x="66" y="54" fill="#94a3b8">the core</text>
        <text x="380" y="34" fill="#e2e8f0">keys/ git-ignored · VM secrets root-only 600 · least-privilege</text>
        <text x="380" y="54" fill="#94a3b8">automation identity · temp tokens revoked · secret-scan CI</text>
        <text x="810" y="44" fill="#e2e8f0">credential leaks, blast radius</text>
      </g>
    </g>

    <text x="90" y="958" font-size="12" fill="#64748b">Lockdown = stop the Coolify control plane only; apps, Traefik/HTTPS and owner SSH keep running. Undo: security-watch.py unlock</text>
  </g>
</svg>

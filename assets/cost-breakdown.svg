<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="t d">
  <title id="t">Cost breakdown: $0.00 per month</title>
  <desc id="d">Every component of the stack is free: Oracle Cloud Always Free compute, storage and egress, DuckDNS, Let's Encrypt, Coolify open source and Gmail SMTP. A bar chart compares approximate monthly prices of typical paid alternatives with this stack at zero dollars.</desc>
  <style>
    .bar { }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .3s } .d3 { animation-delay: .45s }
    .d4 { animation-delay: .6s } .d5 { animation-delay: .75s } .d6 { animation-delay: .9s }
    .val { }
    .v1 { animation-delay: .9s } .v2 { animation-delay: 1.05s } .v3 { animation-delay: 1.2s }
    .v4 { animation-delay: 1.35s } .v5 { animation-delay: 1.5s } .v6 { animation-delay: 1.65s } .v7 { animation-delay: 1.9s }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 8 6; animation: dash 1.6s linear infinite; }
    .card { }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="paid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="1238.5" height="798.5" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="50" font-size="26" font-weight="700" fill="#0f172a">What it costs</text>
    <text x="40" y="76" font-size="14" fill="#475569">Free-only Oracle tenancy: paid shapes have a limit of 0, so nothing billable can even be created.</text>

    <!-- hero -->
    <g transform="translate(40,100)">
      <rect x="-4" y="-4" width="548" height="158" rx="21" fill="none" stroke="#16a34a" stroke-width="2" class="pulse"/>
      <rect width="540" height="150" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
      <text x="30" y="92" font-size="72" font-weight="800" fill="#15803d">$0.00</text>
      <text x="300" y="66" font-size="22" font-weight="700" fill="#0f172a">per month</text>
      <text x="300" y="92" font-size="14" fill="#475569">forever, within the</text>
      <text x="300" y="112" font-size="14" fill="#475569">Always Free limits</text>
      <text x="30" y="130" font-size="12" fill="#166534">plus a $1 budget alert as a tripwire</text>
    </g>

    <!-- free components -->
    <g font-size="13">
      <text x="40" y="290" font-size="15" font-weight="700" fill="#0f172a">Oracle Cloud Always Free (home region)</text>
      <g transform="translate(40,302)" class="card">
        <rect width="265" height="76" rx="10" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="26" font-weight="700" fill="#C74634">Ampere A1 (ARM)</text>
        <text x="14" y="46" fill="#475569">up to the account limit</text>
        <text x="14" y="64" fill="#64748b" font-size="12">documented: 4 OCPU / 24 GB</text>
      </g>
      <g transform="translate(315,302)" class="card">
        <rect width="265" height="76" rx="10" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="26" font-weight="700" fill="#C74634">2x E2.1.Micro (AMD)</text>
        <text x="14" y="46" fill="#475569">1/8 OCPU · 1 GB RAM each</text>
        <text x="14" y="64" fill="#64748b" font-size="12">home region only</text>
      </g>
      <g transform="translate(40,388)" class="card">
        <rect width="265" height="76" rx="10" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="26" font-weight="700" fill="#C74634">200 GB block storage</text>
        <text x="14" y="46" fill="#475569">boot + block volumes</text>
        <text x="14" y="64" fill="#64748b" font-size="12">shared across all VMs</text>
      </g>
      <g transform="translate(315,388)" class="card">
        <rect width="265" height="76" rx="10" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="26" font-weight="700" fill="#C74634">10 TB egress / month</text>
        <text x="14" y="46" fill="#475569">2 VCNs · public IPv4</text>
        <text x="14" y="64" fill="#64748b" font-size="12">outbound data transfer</text>
      </g>

      <text x="40" y="500" font-size="15" font-weight="700" fill="#0f172a">Everything else</text>
      <g transform="translate(40,512)" class="card">
        <rect width="265" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="25" font-weight="700" fill="#b45309">DuckDNS</text>
        <text x="14" y="45" fill="#475569">domain + wildcard · $0</text>
      </g>
      <g transform="translate(315,512)" class="card">
        <rect width="265" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="25" font-weight="700" fill="#15803d">Let's Encrypt</text>
        <text x="14" y="45" fill="#475569">TLS certificates · $0</text>
      </g>
      <g transform="translate(40,582)" class="card">
        <rect width="265" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="25" font-weight="700" fill="#4f46e5">Coolify (open source)</text>
        <text x="14" y="45" fill="#475569">self-hosted PaaS · $0</text>
      </g>
      <g transform="translate(315,582)" class="card">
        <rect width="265" height="60" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="25" font-weight="700" fill="#e11d48">Gmail SMTP</text>
        <text x="14" y="45" fill="#475569">alert emails · $0</text>
      </g>
      <g transform="translate(40,652)" class="card">
        <rect width="540" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
        <text x="14" y="25" font-weight="700" fill="#0f172a">Ubuntu · Docker · Traefik · fail2ban · msmtp</text>
        <text x="14" y="45" fill="#475569">open-source tooling · $0</text>
      </g>
    </g>

    <!-- comparison chart -->
    <g transform="translate(620,100)">
      <rect width="580" height="660" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
      <text x="28" y="40" font-size="17" font-weight="700" fill="#0f172a">Typical monthly price for similar capability</text>
      <text x="28" y="62" font-size="12" fill="#b45309">Approximate list prices, for orientation only. Check vendors for current pricing.</text>

      <!-- axis: $0..$60 over 270 px (4.5 px per $), bars start at x=210 -->
      <g font-size="12" fill="#64748b">
        <path d="M210 88 V448" stroke="#94a3b8"/>
        <path d="M277.5 88 V448" stroke="#e2e8f0" stroke-dasharray="3 4"/>
        <path d="M345 88 V448" stroke="#e2e8f0" stroke-dasharray="3 4"/>
        <path d="M412.5 88 V448" stroke="#e2e8f0" stroke-dasharray="3 4"/>
        <path d="M480 88 V448" stroke="#e2e8f0" stroke-dasharray="3 4"/>
        <text x="210" y="470" text-anchor="middle">$0</text>
        <text x="277.5" y="470" text-anchor="middle">$15</text>
        <text x="345" y="470" text-anchor="middle">$30</text>
        <text x="412.5" y="470" text-anchor="middle">$45</text>
        <text x="480" y="470" text-anchor="middle">$60</text>
      </g>

      <g font-size="13">
        <text x="28" y="116" fill="#0f172a">Vercel Pro</text>
        <text x="28" y="133" fill="#64748b" font-size="11">per member</text>
        <rect x="210" y="102" width="90" height="28" rx="6" fill="url(#paid)" class="bar d1"/>
        <text x="310" y="121" fill="#be123c" class="val v1">~$20</text>

        <text x="28" y="176" fill="#0f172a">Netlify Pro</text>
        <text x="28" y="193" fill="#64748b" font-size="11">per member</text>
        <rect x="210" y="162" width="85.5" height="28" rx="6" fill="url(#paid)" class="bar d2"/>
        <text x="305" y="181" fill="#be123c" class="val v2">~$19</text>

        <text x="28" y="236" fill="#0f172a">Managed PaaS</text>
        <text x="28" y="253" fill="#64748b" font-size="11">app + small DB</text>
        <rect x="210" y="222" width="112.5" height="28" rx="6" fill="url(#paid)" class="bar d3"/>
        <text x="332" y="241" fill="#be123c" class="val v3">~$25+</text>

        <text x="28" y="296" fill="#0f172a">VPS 2 vCPU / 12 GB</text>
        <text x="28" y="313" fill="#64748b" font-size="11">typical cloud</text>
        <rect x="210" y="282" width="180" height="28" rx="6" fill="url(#paid)" class="bar d4"/>
        <rect x="390" y="282" width="90" height="28" rx="6" fill="#e11d48" fill-opacity="0.22" class="bar d5"/>
        <text x="490" y="301" fill="#be123c" class="val v4">~$40-60</text>

        <text x="28" y="356" fill="#0f172a">Domain + TLS</text>
        <text x="28" y="373" fill="#64748b" font-size="11">registrar, amortized</text>
        <rect x="210" y="342" width="5" height="28" rx="2" fill="#e11d48" class="bar d5"/>
        <text x="225" y="361" fill="#be123c" class="val v5">~$1</text>

        <text x="28" y="416" fill="#0f172a">Monitoring / alerts</text>
        <text x="28" y="433" fill="#64748b" font-size="11">SaaS starter tier</text>
        <rect x="210" y="402" width="45" height="28" rx="6" fill="url(#paid)" class="bar d6"/>
        <text x="265" y="421" fill="#be123c" class="val v6">~$10</text>

        <g transform="translate(16,500)">
          <rect width="548" height="60" rx="10" fill="#f0fdf4"/>
          <rect width="548" height="60" rx="10" fill="none" stroke="#16a34a" stroke-width="1.5" class="flow"/>
          <text x="14" y="26" fill="#14532d" font-weight="700" font-size="14">This stack</text>
          <text x="14" y="45" fill="#166534" font-size="11">all of the above, self-hosted</text>
          <circle cx="200" cy="30" r="13" fill="#16a34a" fill-opacity="0.35" class="dot"/>
          <circle cx="200" cy="30" r="8" fill="#16a34a"/>
          <text x="222" y="37" fill="#15803d" font-weight="800" font-size="20" class="val v7">$0</text>
        </g>
      </g>

      <text x="28" y="604" font-size="12" fill="#475569">Trade-offs you accept instead of money: you operate it yourself,</text>
      <text x="28" y="622" font-size="12" fill="#475569">ARM capacity can be scarce, one region and one VM (no HA).</text>
    </g>
  </g>
</svg>

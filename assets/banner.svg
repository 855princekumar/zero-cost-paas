<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">Zero-Cost PaaS</title>
  <desc id="d">Project banner: self-hosted Vercel/Netlify alternative on Oracle Cloud Always Free with Coolify. Highlights: $0 per month, automatic HTTPS, self-healing security, headless infrastructure as code. An animated flow shows git push, deployment on the Oracle Cloud VM, and HTTPS delivery to users.</desc>
  <style>
    .drift { animation: drift 8s linear infinite; }
    .glow { animation: glow 6s ease-in-out infinite; }
    .chip { }
    .c1 { animation-delay: .2s } .c2 { animation-delay: .45s } .c3 { animation-delay: .7s } .c4 { animation-delay: .95s }
    .flow { stroke-dasharray: 7 7; animation: dash 1.2s linear infinite; }
    .node { }
    .n1 { animation-delay: .3s } .n2 { animation-delay: .6s } .n3 { animation-delay: .9s }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(32px,32px); } }
    @keyframes glow { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C74634"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="380" rx="16"/></clipPath>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <path id="p1" d="M296 330 H514"/>
    <path id="p2" d="M766 330 H984"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <g class="drift"><rect x="-64" y="-64" width="1408" height="508" fill="url(#grid)"/></g>
    <rect width="1280" height="380" fill="url(#glowA)" class="glow"/>
    <rect width="1280" height="380" fill="url(#glowB)"/>
    <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  </g>

  <!-- logo mark: cloud + bolt -->
  <g transform="translate(70,62)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <path d="M28 78 a18 18 0 0 1 4 -35 a24 24 0 0 1 46 -6 a16 16 0 0 1 14 41 z" fill="none" stroke="#0d9488" stroke-width="5" stroke-linejoin="round"/>
    <path d="M64 50 L52 74 H64 L58 94 L78 66 H66 L72 50 Z" fill="#d97706"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="220" y="112" font-size="62" font-weight="800" fill="#0f172a" letter-spacing="-1">Zero-Cost <tspan fill="#0d9488">PaaS</tspan></text>
    <text x="222" y="150" font-size="21" fill="#475569">Self-hosted Vercel/Netlify on Oracle Cloud Always Free + Coolify</text>
    <text x="222" y="177" font-size="15" fill="#64748b">Provisioned headlessly via the OCI API · hardened · monitored · self-migrating</text>

    <g font-size="15" font-weight="600">
      <g transform="translate(222,198)"><g class="chip c1">
        <rect width="128" height="36" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <circle cx="20" cy="18" r="6" fill="#16a34a"/>
        <text x="34" y="23" fill="#14532d">$0 / month</text>
      </g></g>
      <g transform="translate(364,198)"><g class="chip c2">
        <rect width="132" height="36" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
        <rect x="14" y="15" width="12" height="10" rx="2" fill="#0d9488"/>
        <path d="M16 15 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#0d9488" stroke-width="2"/>
        <text x="34" y="23" fill="#134e4a">Auto-HTTPS</text>
      </g></g>
      <g transform="translate(510,198)"><g class="chip c3">
        <rect width="200" height="36" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
        <path d="M20 8 l9 4 v6 c0 5 -4 8 -9 10 c-5 -2 -9 -5 -9 -10 v-6 z" fill="#4f46e5"/>
        <text x="36" y="23" fill="#312e81">Self-healing security</text>
      </g></g>
      <g transform="translate(724,198)"><g class="chip c4">
        <rect width="150" height="36" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
        <text x="16" y="23" fill="#d97706" font-family="Consolas, Menlo, monospace">&gt;<tspan class="blink">_</tspan></text>
        <text x="40" y="23" fill="#78350f">Headless IaC</text>
      </g></g>
    </g>
  </g>

  <!-- right side stack illustration -->
  <g transform="translate(960,40)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <rect x="0" y="0" width="250" height="204" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="20" cy="18" r="5" fill="#e11d48"/><circle cx="36" cy="18" r="5" fill="#d97706"/><circle cx="52" cy="18" r="5" fill="#16a34a"/>
    <g transform="translate(16,36)">
      <rect width="218" height="30" rx="8" fill="#fef2f2" stroke="#C74634" stroke-width="1.5"/>
      <text x="12" y="20" fill="#0f172a">Oracle Cloud · Always Free</text>
    </g>
    <g transform="translate(16,74)">
      <rect width="218" height="30" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <text x="12" y="20" fill="#0f172a">Ubuntu 24.04 · Docker</text>
    </g>
    <g transform="translate(16,112)">
      <rect width="218" height="30" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
      <text x="12" y="20" fill="#0f172a">Coolify · Traefik · Let's Encrypt</text>
    </g>
    <g transform="translate(16,150)">
      <rect width="218" height="30" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
      <text x="12" y="20" fill="#0f172a">https://&lt;app&gt;.&lt;BASE_DOMAIN&gt;</text>
    </g>
  </g>

  <!-- animated delivery flow: git push -> Oracle Cloud VM -> users -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <use href="#p1" stroke="#4f46e5" stroke-width="2.5" fill="none" class="flow"/>
    <use href="#p2" stroke="#0d9488" stroke-width="2.5" fill="none" class="flow"/>
    <path d="M506 324 L516 330 L506 336 Z" fill="#4f46e5"/>
    <path d="M976 324 L986 330 L976 336 Z" fill="#0d9488"/>
    <text x="405" y="314" text-anchor="middle" font-size="12" fill="#4f46e5">build + deploy</text>
    <text x="875" y="314" text-anchor="middle" font-size="12" fill="#0d9488">HTTPS to users</text>

    <circle r="5" fill="#4f46e5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" fill="#4f46e5" opacity="0.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5" fill="#0d9488"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5" fill="#0d9488" opacity="0.5"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

    <g class="node n1">
      <rect x="70" y="308" width="226" height="44" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" filter="url(#sh)"/>
      <circle cx="98" cy="322" r="4" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <circle cx="98" cy="340" r="4" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <circle cx="112" cy="326" r="4" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <path d="M98 326 V336 M101 330 Q108 330 110 329" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <text x="126" y="335" fill="#0f172a" font-weight="600">git push</text>
      <text x="190" y="335" fill="#64748b" font-size="12">your repo</text>
    </g>
    <g class="node n2">
      <rect x="520" y="308" width="246" height="44" rx="22" fill="#ffffff" stroke="#C74634" stroke-width="1.5" filter="url(#sh)"/>
      <path d="M546 340 a7 7 0 0 1 1 -13 a9 9 0 0 1 17 -2 a6 6 0 0 1 5 15 z" fill="none" stroke="#C74634" stroke-width="2" stroke-linejoin="round"/>
      <text x="580" y="335" fill="#0f172a" font-weight="600">Coolify on OCI VM</text>
    </g>
    <g class="node n3">
      <rect x="990" y="308" width="220" height="44" rx="22" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#sh)"/>
      <circle cx="1016" cy="330" r="10" fill="none" stroke="#0d9488" stroke-width="2"/>
      <path d="M1006 330 H1026 M1016 320 Q1009 330 1016 340 Q1023 330 1016 320" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <text x="1036" y="335" fill="#0f172a" font-weight="600">Users worldwide</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="378.5" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>

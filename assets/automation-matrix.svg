<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="t d">
  <title id="t">Automation matrix</title>
  <desc id="d">Table of every automated job on the VM: what it does, how often it runs, the automated action it may take, and whether it emails. Jobs: duckdns timer, health-check, security-watch host, security-watch feeds, daily health report, unattended upgrades, Coolify auto-update, fail2ban, and the AMD to ARM migrator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="760" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="44" font-size="24" font-weight="700" fill="#f8fafc">Automation matrix — what runs by itself</text>
    <text x="30" y="66" font-size="13" fill="#94a3b8">Every job is a systemd unit/timer or a daemon on the VM — nothing depends on your laptop being on.</text>

    <!-- header -->
    <rect x="30" y="84" width="1180" height="40" rx="10" fill="#1e293b"/>
    <g font-size="13" font-weight="700" fill="#cbd5e1">
      <text x="48" y="109">Automation</text>
      <text x="290" y="109">Runs</text>
      <text x="420" y="109">Watches / does</text>
      <text x="800" y="109">Automated action</text>
      <text x="1080" y="109">Email</text>
    </g>

    <g font-size="13">
      <!-- row helper: y step 66 -->
      <g transform="translate(30,132)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#f59e0b"/>
        <text x="18" y="26" font-weight="700" fill="#fde68a">duckdns.timer</text><text x="18" y="45" fill="#64748b" font-size="12">duckdns.service</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#1c1a12" stroke="#f59e0b"/><text x="297" y="35" text-anchor="middle" fill="#fde68a" font-size="12">5 min</text>
        <text x="390" y="26" fill="#e2e8f0">Points &lt;BASE_DOMAIN&gt; at this VM's public IP</text><text x="390" y="45" fill="#94a3b8">wildcard sub-names follow automatically</text>
        <text x="770" y="35" fill="#cbd5e1">re-registers IP after any change</text>
        <text x="1050" y="35" fill="#64748b">—</text>
      </g>
      <g transform="translate(30,198)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#22c55e"/>
        <text x="18" y="26" font-weight="700" fill="#bbf7d0">health-check</text><text x="18" y="45" fill="#64748b" font-size="12">health-check.timer</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#0f2320" stroke="#22c55e"/><text x="297" y="35" text-anchor="middle" fill="#bbf7d0" font-size="12">5 min</text>
        <text x="390" y="26" fill="#e2e8f0">RAM+swap, disk ≥85%, Coolify containers,</text><text x="390" y="45" fill="#94a3b8">HTTPS /login 200, cert &lt;14 d, reboot-required, bans</text>
        <text x="770" y="35" fill="#cbd5e1">alert; clears cooldown on recovery</text>
        <text x="1050" y="35" fill="#86efac">✓ max 1 / issue / 6 h</text>
      </g>
      <g transform="translate(30,264)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#ef4444"/>
        <text x="18" y="26" font-weight="700" fill="#fecaca">security-watch host</text><text x="18" y="45" fill="#64748b" font-size="12">security-watch-host.timer</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#2a1414" stroke="#ef4444"/><text x="297" y="35" text-anchor="middle" fill="#fecaca" font-size="12">5 min</text>
        <text x="390" y="26" fill="#e2e8f0">UID-0 accounts, ld.so.preload, miners, /dev/shm,</text><text x="390" y="45" fill="#94a3b8">SSH keys, root SSH from public IP, file integrity</text>
        <text x="770" y="26" fill="#fca5a5">kill · quarantine · lock · revert</text><text x="770" y="45" fill="#fca5a5">→ LOCKDOWN on critical</text>
        <text x="1050" y="35" fill="#86efac">✓ immediately</text>
      </g>
      <g transform="translate(30,330)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#6366f1"/>
        <text x="18" y="26" font-weight="700" fill="#c7d2fe">security-watch feeds</text><text x="18" y="45" fill="#64748b" font-size="12">security-watch-feeds.timer</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#15152b" stroke="#6366f1"/><text x="297" y="35" text-anchor="middle" fill="#c7d2fe" font-size="12">6 h</text>
        <text x="390" y="26" fill="#e2e8f0">Coolify releases + advisories, Laravel/Livewire/</text><text x="390" y="45" fill="#94a3b8">Traefik advisories, CISA KEV (filtered to stack)</text>
        <text x="770" y="26" fill="#a5b4fc">auto-upgrade Coolify, or lockdown</text><text x="770" y="45" fill="#a5b4fc">if no fix is released</text>
        <text x="1050" y="35" fill="#86efac">✓ new items only</text>
      </g>
      <g transform="translate(30,396)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#14b8a6"/>
        <text x="18" y="26" font-weight="700" fill="#99f6e4">health-report</text><text x="18" y="45" fill="#64748b" font-size="12">health-report.timer</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#0f2a2a" stroke="#14b8a6"/><text x="297" y="35" text-anchor="middle" fill="#99f6e4" font-size="12">daily 09:00</text>
        <text x="390" y="26" fill="#e2e8f0">Uptime, memory, disk, containers, cert expiry,</text><text x="390" y="45" fill="#94a3b8">bans, failed logins, pending updates, migrator</text>
        <text x="770" y="35" fill="#cbd5e1">summary only</text>
        <text x="1050" y="35" fill="#86efac">✓ daily</text>
      </g>
      <g transform="translate(30,462)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#38bdf8"/>
        <text x="18" y="26" font-weight="700" fill="#bae6fd">unattended-upgrades</text><text x="18" y="45" fill="#64748b" font-size="12">apt-daily-upgrade.timer</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#132033" stroke="#38bdf8"/><text x="297" y="35" text-anchor="middle" fill="#bae6fd" font-size="12">daily</text>
        <text x="390" y="26" fill="#e2e8f0">Ubuntu security + Docker CE packages</text><text x="390" y="45" fill="#94a3b8">removes unused kernels/deps</text>
        <text x="770" y="26" fill="#cbd5e1">install patches; auto-reboot</text><text x="770" y="45" fill="#cbd5e1">at 04:00 if kernel/libc needs it</text>
        <text x="1050" y="35" fill="#86efac">✓ on change</text>
      </g>
      <g transform="translate(30,528)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#a78bfa"/>
        <text x="18" y="26" font-weight="700" fill="#ddd6fe">Coolify auto-update</text><text x="18" y="45" fill="#64748b" font-size="12">built into Coolify</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#1a1625" stroke="#a78bfa"/><text x="297" y="35" text-anchor="middle" fill="#ddd6fe" font-size="12">daily</text>
        <text x="390" y="26" fill="#e2e8f0">Upgrades Coolify to the latest stable release</text><text x="390" y="45" fill="#94a3b8">security-watch handles urgent ones sooner</text>
        <text x="770" y="35" fill="#cbd5e1">upgrade in place</text>
        <text x="1050" y="35" fill="#86efac">✓ via Coolify</text>
      </g>
      <g transform="translate(30,594)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#f87171"/>
        <text x="18" y="26" font-weight="700" fill="#fecaca">fail2ban</text><text x="18" y="45" fill="#64748b" font-size="12">jails: sshd, coolify-login</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#2a1414" stroke="#f87171"/><text x="297" y="35" text-anchor="middle" fill="#fecaca" font-size="12">real time</text>
        <text x="390" y="26" fill="#e2e8f0">SSH: 3 fails / 10 min · dashboard: 5 fails / 10 min</text><text x="390" y="45" fill="#94a3b8">from journald and Coolify's audit log</text>
        <text x="770" y="35" fill="#cbd5e1">ban IP 24 h (escalating for SSH)</text>
        <text x="1050" y="35" fill="#86efac">✓ dashboard bans</text>
      </g>
      <g transform="translate(30,660)">
        <rect width="1180" height="60" rx="8" fill="#111827" stroke="#1e293b"/>
        <rect width="6" height="60" rx="3" fill="#C74634"/>
        <text x="18" y="26" font-weight="700" fill="#fecaca">oci-migrator</text><text x="18" y="45" fill="#64748b" font-size="12">systemd service, restarts</text>
        <rect x="258" y="18" width="78" height="24" rx="12" fill="#1f1311" stroke="#C74634"/><text x="297" y="35" text-anchor="middle" fill="#fecaca" font-size="12">until ARM</text>
        <text x="390" y="26" fill="#e2e8f0">Retries Ampere A1 capacity across fault domains</text><text x="390" y="45" fill="#94a3b8">then moves Coolify + data, switches DNS</text>
        <text x="770" y="26" fill="#cbd5e1">launch · restore · cut over ·</text><text x="770" y="45" fill="#cbd5e1">delete old VM · resize to max</text>
        <text x="1050" y="35" fill="#86efac">✓ start/done/fail</text>
      </g>
    </g>

    <text x="30" y="744" font-size="12" fill="#64748b">Alerts go to &lt;ALERT_EMAIL&gt; through Gmail SMTP (msmtp on the host, SMTP settings inside Coolify). A "Server booted" email is also sent on every boot.</text>
  </g>
</svg>

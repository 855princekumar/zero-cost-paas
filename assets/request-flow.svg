<circle r="4" fill="#0d9488" filter="url(#glow)"><animateMotion dur="3.0s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#r3"/></animateMotion></circle>
<circle r="4" fill="#0d9488" filter="url(#glow)"><animateMotion dur="3.0s" begin="-2.0s" repeatCount="indefinite"><mpath xlink:href="#r4"/></animateMotion></circle>
<circle r="4" fill="#0d9488" filter="url(#glow)"><animateMotion dur="4.0s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#ret"/></animateMotion></circle>
<g><rect x="528.9" y="350.0" width="330.2" height="20" rx="10.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="694.0" y="364.0" font-size="11" fill="#0d9488" text-anchor="middle">response returns over the same encrypted connection</text></g>
<circle r="4" fill="#16a34a" filter="url(#glow)"><animateMotion dur="9.0s" begin="-0.0s" repeatCount="indefinite"><mpath xlink:href="#m0"/></animateMotion></circle>

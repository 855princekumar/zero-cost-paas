<circle r="4" fill="#d97706" filter="url(#glow)"><animateMotion dur="9.0s" begin="-3.0s" repeatCount="indefinite"><mpath xlink:href="#m2"/></animateMotion></circle>
<circle r="4" fill="#16a34a" filter="url(#glow)"><animateMotion dur="9.0s" begin="-4.5s" repeatCount="indefinite"><mpath xlink:href="#m3"/></animateMotion></circle>
<circle r="4" fill="#16a34a" filter="url(#glow)"><animateMotion dur="9.0s" begin="-6.0s" repeatCount="indefinite"><mpath xlink:href="#m4"/></animateMotion></circle>
<circle r="4" fill="#16a34a" filter="url(#glow)"><animateMotion dur="9.0s" begin="-7.5s" repeatCount="indefinite"><mpath xlink:href="#m5"/></animateMotion></circle>
</g>
</svg>

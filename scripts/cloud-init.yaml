#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - htop
  - unzip
  - jq
  - python3-venv
  - fail2ban
  - unattended-upgrades
  - netfilter-persistent
  - iptables-persistent
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}
  # Oracle's Ubuntu image ships iptables rules that REJECT everything except SSH;
  # insert ACCEPT rules just above the REJECT. Usage: open-ports 80 443 3000
  - path: /usr/local/sbin/open-ports
    permissions: '0755'
    content: |
      #!/bin/sh
      set -e
      for p in "$@"; do
        iptables -C INPUT -p tcp -m state --state NEW --dport "$p" -j ACCEPT 2>/dev/null && continue
        n=$(iptables -L INPUT --line-numbers -n | awk '/REJECT/ {print $1; exit}')
        iptables -I INPUT "${n:-1}" -p tcp -m state --state NEW --dport "$p" -j ACCEPT
      done
      netfilter-persistent save
runcmd:
  - /usr/local/sbin/open-ports 80 443
  # 4 GB swap
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # Docker Engine + Compose plugin (official repo, arm64)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker fail2ban
  - timedatectl set-timezone Etc/UTC   # change to your timezone if you like
  # migrate.py injects /usr/local/sbin/harden (harden.sh) into the ARM's cloud-init
  - if [ -x /usr/local/sbin/harden ]; then /usr/local/sbin/harden > /var/log/harden.log 2>&1; fi
  - touch /var/log/setup-done

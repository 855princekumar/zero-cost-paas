name: CodeQL

# CodeQL code scanning: results go to the repository's Security tab (free on public repos),
# the SARIF report is kept as an artifact, and the build fails on any finding.
# On a private repo without GitHub Advanced Security, set upload: never.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, catches new queries against unchanged code

permissions:
  contents: read
  actions: read
  security-events: write   # upload results to the Security tab

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: always
          output: sarif
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
      - name: Fail on findings
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          results = [(r["ruleId"], loc["physicalLocation"]["artifactLocation"]["uri"],
                      loc["physicalLocation"]["region"].get("startLine"), r["message"]["text"])
                     for f in glob.glob("sarif/*.sarif")
                     for run in json.load(open(f))["runs"]
                     for r in run.get("results", [])
                     for loc in r.get("locations", [])[:1]]
          for rule, uri, line, msg in results:
              print(f"::warning file={uri},line={line}::{rule}: {msg}")
          print(f"{len(results)} finding(s)")
          sys.exit(1 if results else 0)
          EOF

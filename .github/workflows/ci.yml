name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (errors)
        run: shellcheck --severity=error scripts/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python syntax
        run: python -m py_compile scripts/*.py
      - name: cloud-init YAML
        run: |
          pip install -q pyyaml
          python -c "import yaml; d = yaml.safe_load(open('scripts/cloud-init.yaml')); assert 'runcmd' in d"
      - name: SVG well-formed
        run: python -c "import glob,xml.dom.minidom as m; [m.parse(f) for f in glob.glob('assets/*.svg')]"

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: relative links and anchors resolve
        run: |
          python - <<'EOF'
          import glob, os, re, sys

          def slug(heading):  # GitHub heading anchor
              return re.sub(r"[^\w\- ]", "", heading.strip().lower()).replace(" ", "-")

          def anchors(path):
              with open(path, encoding="utf-8") as f:
                  return {slug(h) for h in re.findall(r"^#+ (.+)$", f.read(), re.M)}

          bad = []
          for md in glob.glob("**/*.md", recursive=True):
              with open(md, encoding="utf-8") as f:
                  links = re.findall(r"\]\(([^)\s]+)\)", f.read())
              for link in links:
                  if "://" in link or link.startswith("mailto:"):
                      continue
                  path, _, anchor = link.partition("#")
                  target = os.path.normpath(os.path.join(os.path.dirname(md), path)) if path else md
                  if not os.path.exists(target):
                      bad.append(f"{md}: missing {link}")
                  elif anchor and target.endswith(".md") and anchor not in anchors(target):
                      bad.append(f"{md}: missing anchor #{anchor}")
          print("\n".join(bad) or "all relative links and anchors OK")
          sys.exit(1 if bad else 0)
          EOF
